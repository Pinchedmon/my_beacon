version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: pg_beacon
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-postgres}
    env_file:
      - ./.env
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  
    container_name: minio_beacon
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"   
    volumes:
      - minio-data:/data
    healthcheck:
      test:
         [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      MINIO_HOST: minio
      MINIO_PORT: 9000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  minio-data:
