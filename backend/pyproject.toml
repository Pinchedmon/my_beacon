[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx2>=2.9.1",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.52.1",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
# backend/ = sources root: импорты вида `core.config`, не `backend.core.config`
extraPaths = ["."]
include = ["."]
exclude = [
    ".venv",
    "**/__pycache__",
    "**/.ruff_cache",
    "**/.pytest_cache",
    "db/migrations",
]
reportMissingTypeStubs = false
reportPrivateImportUsage = "warning"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportImplicitOverride = "none"
reportOptionalMemberAccess = "warning"


[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (сортировка импортов)
    "N",      # pep8-naming
    "UP",     # pyupgrade (современный синтаксис)
    "B",      # flake8-bugbear (частые баги)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-специфичные правила
    "ASYNC",  # flake8-async (для async/await кода)
    "S",      # flake8-bandit (базовая безопасность)
    "A",      # flake8-builtins (затенение встроенных имён)
    "T20",    # flake8-print (запрет print в проде)
]
ignore = [
    "RUF002",
    "E501",
    "S101",
    "E402",
    # Кириллица в строках/докстрингах/комментариях — проект русскоязычный
    "RUF001",
    "RUF002",
    "RUF003",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "T20"]
"**/__init__.py" = ["F401"]  
"models/*" = ["F821", "UP037"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    "sqlalchemy.orm.session",
    "sqlalchemy.orm.query",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "db",
    "exceptions",
    "repositories",
    "schemas",
    "services",
    "tests",
]
combine-as-imports = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "sqlalchemy.orm.declared_attr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Пул asyncpg привязан к event loop. Движок живёт всю сессию, значит и тесты,
# и фикстуры должны крутиться в одном и том же лупе — иначе
# "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
